<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumulative cubic B-spline (R¹)</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--grid:#e3e3dc;--dom:#2a6fdb14;--c1:#d9480f;--c2:#2f9e44;--c3:#9c36b5;--acc:#2a6fdb;--card:#fff;--bd:#d8d8d0;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececea;--mut:#9a9a94;--grid:#2c2d30;--dom:#5b9bff1c;--c1:#ff8b5c;--c2:#5fd37a;--c3:#cf7ee6;--acc:#5b9bff;--card:#1f2023;--bd:#34353a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececea;--mut:#9a9a94;--grid:#2c2d30;--dom:#5b9bff1c;--c1:#ff8b5c;--c2:#5fd37a;--c3:#cf7ee6;--acc:#5b9bff;--card:#1f2023;--bd:#34353a;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.15rem;margin:0 0 4px}
p.sub{margin:0 0 12px;color:var(--mut);font-size:.88rem;line-height:1.4}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:12px}
canvas{width:100%;display:block;touch-action:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
#out{line-height:1.6;overflow-x:auto;white-space:pre}
h2{font-size:.9rem;margin:0 0 6px;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Cumulative cubic B-spline in R¹</h1>
<p class="sub">Drag the four control points vertically. Control point <i>i</i> sits at knot time <i>i</i>; with 4 points the spline is defined on a single segment, t ∈ [1, 2], where u = t − 1.</p>

<div class="card"><canvas id="c1" height="320"></canvas></div>

<div class="card">
  <div class="row">
    <label for="t" class="mono">t = <span id="tv">1.500</span></label>
    <input id="t" type="range" min="1" max="2" step="0.001" value="1.5">
    <button id="play">Play</button>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="card"><h2>Cumulative basis functions B̃ⱼ(u)</h2><canvas id="c2" height="200"></canvas></div>

<div class="card"><h2>Velocity p′(t)</h2><canvas id="c3" height="170"></canvas></div>
<div class="card"><h2>Acceleration p″(t)</h2><canvas id="c4" height="170"></canvas></div>

<div class="card"><h2>Evaluation</h2><div id="out" class="mono"></div></div>
</main>

<script>
const P=[0.0,1.0,-0.5,1.5], P0=[0,1,-0.5,1.5];
const $=id=>document.getElementById(id);
const c1=$('c1'),c2=$('c2'),c3=$('c3'),c4=$('c4'),ts=$('t');
let drag=-1,playing=false,raf=0,last=0,dir=1;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function basis(u){const u2=u*u,u3=u2*u;
  return [1,(5+3*u-3*u2+u3)/6,(1+3*u+3*u2-2*u3)/6,u3/6];}
function evalP(u){const b=basis(u);
  return P[0]+b[1]*(P[1]-P[0])+b[2]*(P[2]-P[1])+b[3]*(P[3]-P[2]);}

// derivatives w.r.t. t (u = t − 1, unit knot spacing, so d/dt = d/du)
function dbasis(u){return [0,(1-u)*(1-u)/2,(1+2*u-2*u*u)/2,u*u/2];}
function ddbasis(u){return [0,u-1,1-2*u,u];}
function comb(b){return b[1]*(P[1]-P[0])+b[2]*(P[2]-P[1])+b[3]*(P[3]-P[2]);}
function evalV(u){return comb(dbasis(u));}
function evalA(u){return comb(ddbasis(u));}

function plotSeries(c,fn,col,name){
  const{g,w,h}=setup(c),m={l:52,r:16,t:12,b:24},N=200,ys=[];
  for(let k=0;k<=N;k++)ys.push(fn(k/N));
  let lo=Math.min(0,...ys),hi=Math.max(0,...ys);
  if(hi-lo<1e-6){hi+=1;lo-=1;}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const X=u=>m.l+u*(w-m.l-m.r),Y=v=>m.t+(hi-v)/(hi-lo)*(h-m.t-m.b);
  g.clearRect(0,0,w,h);g.font='12px system-ui';g.lineWidth=1;
  g.strokeStyle=css('--grid');g.fillStyle=css('--mut');g.textAlign='right';
  [hi,0,lo].forEach((v,i)=>{
    if(i!==1&&Math.abs(Y(v)-Y(0))<14)return;
    g.beginPath();g.moveTo(m.l,Y(v));g.lineTo(w-m.r,Y(v));g.stroke();
    g.fillText(v.toFixed(2),m.l-6,Y(v)+4);
  });
  g.textAlign='center';
  [0,.5,1].forEach(u=>g.fillText('t='+(1+u),X(u),h-6));
  g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();
  ys.forEach((y,k)=>k?g.lineTo(X(k/N),Y(y)):g.moveTo(X(k/N),Y(y)));g.stroke();
  const u=+ts.value-1;
  g.strokeStyle=css('--mut');g.lineWidth=1;g.setLineDash([3,3]);
  g.beginPath();g.moveTo(X(u),m.t);g.lineTo(X(u),h-m.b);g.stroke();g.setLineDash([]);
  g.fillStyle=col;g.beginPath();g.arc(X(u),Y(fn(u)),5.5,0,7);g.fill();
}
function draw3(){plotSeries(c3,evalV,css('--c2'),'v');}
function draw4(){plotSeries(c4,evalA,css('--c3'),'a');}

function setup(c){const r=devicePixelRatio||1,w=c.clientWidth,h=+c.getAttribute('height');
  c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);return{g,w,h};}

const M={l:40,r:16,t:14,b:26};
function map1(w,h){return{
  X:t=>M.l+(t+0.4)/3.8*(w-M.l-M.r),
  Y:v=>M.t+(3-v)/6*(h-M.t-M.b),
  iY:y=>3-(y-M.t)/(h-M.t-M.b)*6};}

function draw1(){
  const{g,w,h}=setup(c1),{X,Y}=map1(w,h);
  g.clearRect(0,0,w,h);g.font='12px system-ui';g.textAlign='center';
  g.fillStyle=css('--dom');g.fillRect(X(1),M.t,X(2)-X(1),h-M.t-M.b);
  g.strokeStyle=css('--grid');g.lineWidth=1;g.fillStyle=css('--mut');
  for(let v=-3;v<=3;v++){g.beginPath();g.moveTo(M.l,Y(v));g.lineTo(w-M.r,Y(v));g.stroke();
    g.textAlign='right';g.fillText(v,M.l-6,Y(v)+4);}
  g.textAlign='center';
  for(let t=0;t<=3;t++){g.beginPath();g.moveTo(X(t),M.t);g.lineTo(X(t),h-M.b);g.stroke();g.fillText('t='+t,X(t),h-8);}
  // control polygon
  g.setLineDash([5,4]);g.strokeStyle=css('--mut');g.beginPath();
  P.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();g.setLineDash([]);
  // spline
  g.strokeStyle=css('--acc');g.lineWidth=3;g.beginPath();
  for(let k=0;k<=200;k++){const u=k/200,x=X(1+u),y=Y(evalP(u));k?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();
  // eval marker
  const t=+ts.value,u=t-1,pv=evalP(u);
  g.strokeStyle=css('--c1');g.lineWidth=1.5;g.setLineDash([3,3]);
  g.beginPath();g.moveTo(X(t),M.t);g.lineTo(X(t),h-M.b);g.stroke();g.setLineDash([]);
  g.fillStyle=css('--c1');g.beginPath();g.arc(X(t),Y(pv),6,0,7);g.fill();
  // control points
  P.forEach((v,i)=>{g.fillStyle=css('--card');g.strokeStyle=css('--fg');g.lineWidth=2;
    g.beginPath();g.arc(X(i),Y(v),9,0,7);g.fill();g.stroke();
    g.fillStyle=css('--fg');g.textAlign='center';g.fillText('P'+i,X(i),Y(v)-16);});
}

function draw2(){
  const{g,w,h}=setup(c2),m={l:40,r:16,t:10,b:24};
  const X=u=>m.l+u*(w-m.l-m.r),Y=v=>m.t+(1-v)*(h-m.t-m.b);
  g.clearRect(0,0,w,h);g.font='12px system-ui';g.fillStyle=css('--mut');g.strokeStyle=css('--grid');g.lineWidth=1;
  [0,.5,1].forEach(v=>{g.beginPath();g.moveTo(m.l,Y(v));g.lineTo(w-m.r,Y(v));g.stroke();g.textAlign='right';g.fillText(v,m.l-6,Y(v)+4);});
  g.textAlign='center';[0,.5,1].forEach(u=>g.fillText('u='+u,X(u),h-6));
  const cols=['',css('--c1'),css('--c2'),css('--c3')],u=+ts.value-1,b=basis(u);
  for(let j=1;j<=3;j++){
    g.strokeStyle=cols[j];g.lineWidth=2.5;g.beginPath();
    for(let k=0;k<=100;k++){const x=k/100,y=basis(x)[j];k?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));}
    g.stroke();g.fillStyle=cols[j];g.beginPath();g.arc(X(u),Y(b[j]),5,0,7);g.fill();
    g.fillText('B̃'+j,X(1)-10,Y(basis(1)[j])+(j==3?14:-6));
  }
  g.strokeStyle=css('--mut');g.setLineDash([3,3]);g.beginPath();g.moveTo(X(u),m.t);g.lineTo(X(u),h-m.b);g.stroke();g.setLineDash([]);
}

function readout(){
  const t=+ts.value,u=t-1,b=basis(u),f=x=>(x>=0?' ':'')+x.toFixed(4);
  const d=[P[1]-P[0],P[2]-P[1],P[3]-P[2]];
  $('tv').textContent=t.toFixed(3);
  $('out').textContent=
`t = ${t.toFixed(3)}    u = t − 1 = ${u.toFixed(3)}
B̃0 = ${f(b[0])}   B̃1 = ${f(b[1])}   B̃2 = ${f(b[2])}   B̃3 = ${f(b[3])}
d1 = P1−P0 = ${f(d[0])}   d2 = P2−P1 = ${f(d[1])}   d3 = P3−P2 = ${f(d[2])}

p(t) = P0 + B̃1·d1 + B̃2·d2 + B̃3·d3
     = ${f(P[0])} + ${f(b[1]*d[0])} + ${f(b[2]*d[1])} + ${f(b[3]*d[2])}
     = ${f(evalP(u))}

B̃′1..3 = ${dbasis(u).slice(1).map(f).join('  ')}
B̃″1..3 = ${ddbasis(u).slice(1).map(f).join('  ')}

v(t) = p′(t) = Σ B̃′ⱼ·dⱼ  = ${f(evalV(u))}
a(t) = p″(t) = Σ B̃″ⱼ·dⱼ  = ${f(evalA(u))}`;
}

function redraw(){draw1();draw2();draw3();draw4();readout();}

// dragging (vertical only, since R¹)
function pos(e){const r=c1.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
c1.addEventListener('pointerdown',e=>{
  const{x,y}=pos(e),{X,Y}=map1(c1.clientWidth,+c1.getAttribute('height'));
  let best=-1,bd=24;
  P.forEach((v,i)=>{const d=Math.hypot(x-X(i),y-Y(v));if(d<bd){bd=d;best=i;}});
  if(best>=0){drag=best;c1.setPointerCapture(e.pointerId);}
});
c1.addEventListener('pointermove',e=>{
  if(drag<0)return;const{y}=pos(e),{iY}=map1(c1.clientWidth,+c1.getAttribute('height'));
  P[drag]=Math.max(-3,Math.min(3,iY(y)));redraw();
});
c1.addEventListener('pointerup',()=>{drag=-1;});
c1.addEventListener('pointercancel',()=>{drag=-1;});

ts.addEventListener('input',redraw);
$('reset').onclick=()=>{P0.forEach((v,i)=>P[i]=v);redraw();};
$('play').onclick=()=>{
  playing=!playing;$('play').textContent=playing?'Pause':'Play';
  if(playing){last=performance.now();raf=requestAnimationFrame(step);}else cancelAnimationFrame(raf);
};
function step(now){
  let t=+ts.value+dir*(now-last)/3000;last=now;
  if(t>=2){t=2;dir=-1}else if(t<=1){t=1;dir=1}
  ts.value=t;redraw();if(playing)raf=requestAnimationFrame(step);
}
addEventListener('resize',redraw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
redraw();
</script>
</body>
</html>
